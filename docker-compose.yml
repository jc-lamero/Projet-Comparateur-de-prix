services:
  db:
    build: ./db
    container_name: comparateur_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: comparateur
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
  web:
    build: ./web
    container_name: comparateur_web
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: comparateur
      DB_USER: app
      DB_PASSWORD: app
    depends_on:
      - db
    ports:
      - "8080:8080"
  scraper:
    build: ./scraper
    container_name: comparateur_scraper
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: comparateur
      DB_USER: app
      DB_PASSWORD: app
    depends_on:
      - db
    volumes:
      - ./scraper/app:/app
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: app
      PMA_PASSWORD: app
    ports:
      - "8081:80"
    depends_on:
      - db  

volumes:
  db_data:
