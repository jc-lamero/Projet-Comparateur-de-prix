<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Comparateur SSD — Meilleurs prix</title>
  <style>
    :root{
      --bg:#0b1220;
      --panel:#0f1a2e;
      --panel2:#101f36;
      --text:#e8eefc;
      --muted:#a9b6d3;
      --line:rgba(255,255,255,.08);
      --chip:rgba(255,255,255,.08);
      --ok:#22c55e;
      --warn:#f59e0b;
      --link:#8ab4ff;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(1200px 800px at 20% 0%, #182a50 0%, var(--bg) 55%);
      color:var(--text);
    }
    .wrap{max-width:1100px; margin:0 auto; padding:24px;}
    header{
      display:flex; gap:14px; align-items:flex-end; justify-content:space-between;
      margin-bottom:18px;
    }
    h1{font-size:28px; margin:0; letter-spacing:.2px}
    .sub{color:var(--muted); font-size:13px}

    .topbar{
      display:flex; gap:10px; flex-wrap:wrap; align-items:center;
      padding:12px; border:1px solid var(--line); background:rgba(255,255,255,.04);
      border-radius:14px;
      margin-bottom:18px;
    }
    .topbar input, .topbar select{
      background:rgba(255,255,255,.06);
      border:1px solid var(--line);
      color:var(--text);
      padding:10px 12px;
      border-radius:12px;
      outline:none;
      min-width:180px;
    }
    .topbar input::placeholder{color:rgba(232,238,252,.55)}
    .btn{
      display:inline-flex; align-items:center; justify-content:center;
      padding:10px 14px; border-radius:12px;
      border:1px solid var(--line); background:rgba(255,255,255,.06);
      color:var(--text); text-decoration:none; cursor:pointer;
      font-weight:600;
    }
    .btn:hover{background:rgba(255,255,255,.10)}

    .grid{
      display:grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap:14px;
    }
    @media (max-width: 980px){ .grid{grid-template-columns: repeat(2, minmax(0, 1fr));} }
    @media (max-width: 640px){ .grid{grid-template-columns: 1fr;} header{flex-direction:column; align-items:flex-start;} }

    .card{
      border:1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border-radius:18px;
      overflow:hidden;
      display:flex; flex-direction:column;
      min-height: 220px;
    }
    .card-top{
      display:flex; gap:12px;
      padding:14px;
    }
    .thumb{
      width:72px; height:72px;
      border-radius:14px;
      background:rgba(255,255,255,.06);
      border:1px solid var(--line);
      display:flex; align-items:center; justify-content:center;
      overflow:hidden;
      flex:0 0 auto;
    }
    .thumb img{width:100%; height:100%; object-fit:cover}
    .thumb .noimg{color:rgba(232,238,252,.5); font-size:12px}

    .title{
      font-weight:700;
      line-height:1.25;
      margin:2px 0 6px 0;
      font-size:14px;
      display:-webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow:hidden;
    }
    .meta{color:var(--muted); font-size:12px}
    .row{
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      padding:0 14px 14px 14px;
      margin-top:auto;
    }
    .price{
      font-size:18px;
      font-weight:800;
      letter-spacing:.2px;
    }
    .chip{
      display:inline-flex; gap:8px; align-items:center;
      padding:6px 10px;
      border-radius:999px;
      border:1px solid var(--line);
      background:var(--chip);
      color:var(--muted);
      font-size:12px;
      font-weight:700;
      text-transform:uppercase;
    }
    .chip strong{color:var(--text); font-weight:800}
    .actions{
      display:flex; gap:10px; padding:0 14px 14px 14px;
    }
    .link{
      color:var(--link);
      text-decoration:none;
      font-weight:700;
    }
    .link:hover{text-decoration:underline}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Comparateur SSD</h1>
        <div class="sub">Mis à jour : {{ now }}</div>
      </div>
      <div class="sub">Sources : LDLC / TopAchat</div>
    </header>

    <form class="topbar" method="get" action="/">
      <input name="q" value="{{ q or '' }}" placeholder="Rechercher (ex: 990 pro, 1 To, Kingston…)"/>
      <select name="source">
        <option value="">Toutes sources</option>
        {% for s in sources %}
          <option value="{{ s }}" {% if source==s %}selected{% endif %}>{{ s }}</option>
        {% endfor %}
      </select>
      <select name="sort">
        <option value="price" {% if sort=='price' %}selected{% endif %}>Tri : prix</option>
        <option value="recent" {% if sort=='recent' %}selected{% endif %}>Tri : récent</option>
      </select>
      <button class="btn" type="submit">Filtrer</button>
      <a class="btn" href="/">Reset</a>
    </form>

    <div class="grid">
      {% for g in data %}
      <div class="card">
        <div class="card-top">
          <div class="thumb">
            {% if g.image_url %}
              <img src="{{ g.image_url }}" alt="Photo {{ g.name }}" loading="lazy">
            {% else %}
              <div class="noimg">No image</div>
            {% endif %}
          </div>
          <div>
            <div class="title" title="{{ g.name }}">{{ g.name }}</div>
            <div class="meta">
              <span class="chip">meilleur : <strong>{{ g.cheapest.source }}</strong></span>
            </div>
          </div>
        </div>

        <div class="row">
          <div class="price">{{ "%.2f"|format(g.cheapest.price_cents/100) }} €</div>
          <a class="link" href="{{ g.cheapest.url }}" target="_blank" rel="noopener">Voir l’offre</a>
        </div>

        <div class="actions">
          <a class="btn" href="/details?key={{ g.key|urlencode }}">Détails</a>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</body>
</html>
