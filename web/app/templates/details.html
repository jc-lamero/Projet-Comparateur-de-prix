<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Détails — {{ name }}</title>
  <style>
    :root{
      --bg:#0b1220; --text:#e8eefc; --muted:#a9b6d3; --line:rgba(255,255,255,.08);
      --panel:rgba(255,255,255,.04); --link:#8ab4ff;
    }
    *{box-sizing:border-box}
    body{
      margin:0; font-family:system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(1200px 800px at 20% 0%, #182a50 0%, var(--bg) 55%);
      color:var(--text);
    }
    .wrap{max-width:1100px; margin:0 auto; padding:24px;}
    a{color:var(--link); text-decoration:none; font-weight:700}
    a:hover{text-decoration:underline}
    .head{
      display:flex; align-items:flex-start; justify-content:space-between; gap:14px; flex-wrap:wrap;
      margin-bottom:16px;
    }
    h1{font-size:18px; margin:0; line-height:1.25}
    .sub{color:var(--muted); font-size:13px}
    .btn{
      display:inline-flex; align-items:center; justify-content:center;
      padding:10px 14px; border-radius:12px;
      border:1px solid var(--line); background:rgba(255,255,255,.06);
      color:var(--text); text-decoration:none; cursor:pointer; font-weight:700;
    }
    .btn:hover{background:rgba(255,255,255,.10)}

    .table{
      width:100%;
      border-collapse:separate;
      border-spacing:0;
      overflow:hidden;
      border:1px solid var(--line);
      border-radius:16px;
      background:var(--panel);
    }
    .table th, .table td{
      padding:12px 14px;
      border-bottom:1px solid var(--line);
      vertical-align:middle;
      font-size:14px;
    }
    .table th{
      color:var(--muted);
      font-size:12px;
      text-transform:uppercase;
      letter-spacing:.12em;
      text-align:left;
      background:rgba(255,255,255,.03);
    }
    .table tr:last-child td{border-bottom:none}

    .col-src{width:140px}
    .col-price{width:140px; text-align:right}
    .col-date{width:200px}
    .col-link{width:120px}

    .badge{
      display:inline-flex;
      padding:6px 10px;
      border-radius:999px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.06);
      font-size:12px;
      font-weight:800;
      text-transform:uppercase;
      color:var(--text);
    }
    .cheap{
      font-weight:900;
    }
    .namecell{
      max-width: 520px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    @media (max-width: 760px){
      .col-date{display:none}
      .namecell{max-width: 260px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <div>
        <h1>{{ name }}</h1>
        <div class="sub">Toutes les offres trouvées (triées par prix)</div>
      </div>
      <div>
        <a class="btn" href="/">← Retour</a>
      </div>
    </div>

    <table class="table">
      <thead>
        <tr>
          <th class="col-src">Site</th>
          <th>Produit</th>
          <th class="col-price">Prix</th>
          <th class="col-date">Dernier scrape</th>
          <th class="col-link">Lien</th>
        </tr>
      </thead>
      <tbody>
        {% for p in items %}
        <tr>
          <td class="col-src"><span class="badge">{{ p.source }}</span></td>
          <td class="namecell" title="{{ p.name }}">{{ p.name }}</td>
          <td class="col-price {% if p.url == cheapest.url %}cheap{% endif %}">
            {{ "%.2f"|format(p.price_cents/100) }} €
          </td>
          <td class="col-date sub">{{ p.scraped_at }}</td>
          <td class="col-link"><a href="{{ p.url }}" target="_blank" rel="noopener">voir</a></td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</body>
</html>
